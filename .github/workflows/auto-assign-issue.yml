name: Auto assign issue
on:
  issues:
    types:
      - opened
jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-assign issue
        uses: pozil/auto-assign-issue@v4
        with:
          assignees: dimhotepus
          numOfAssignee: 1
          allowSelfAssign: false